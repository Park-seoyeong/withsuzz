<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입장 · 써즈의 동네방네</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#eff7fc;color:#243e59;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background-image:radial-gradient(ellipse at top,#dceffb,transparent 65%)}.card{width:min(420px,calc(100% - 40px));background:#fff;border:2px solid #b5d6eb;outline:5px solid #ffffff88;border-radius:16px;padding:36px;box-shadow:0 15px 60px #7babc329;text-align:center}.emblem{width:66px;height:66px;display:grid;place-items:center;margin:0 auto 18px;background:#edf7ff;border:1px solid #c8e1f2;border-radius:50%;font-size:28px}.tag{color:#799cb5;letter-spacing:3px;font-size:10px}h1{font-size:23px;margin:12px 0}p{color:#7c8ea0;line-height:1.8;font-size:13px}label{display:block;text-align:left;font-size:12px;font-weight:600;margin:26px 0 8px}input{width:100%;border:1px solid #ccdeec;border-radius:8px;padding:14px;font:inherit;background:#fafcff;outline:none}input:focus{border-color:#78b8e0;box-shadow:0 0 0 3px #e1f1fc}button{width:100%;padding:13px;margin-top:14px;border:1px solid #68a8cf;border-radius:8px;background:#85bee2;color:#163d5c;font:inherit;font-weight:600;cursor:pointer;box-shadow:inset 0 1px #fff7,0 3px #568cb121}button:disabled{opacity:.5}.error{min-height:24px;font-size:12px;color:#a65448;margin-top:12px}.foot{font-size:10px;color:#93a4b5;margin-top:18px}a{color:#5785a5}</style></head><body><main class="card"><div class="emblem">✧</div><div class="tag">SUZZ'S CONTENT GUILD</div><h1>써즈의 동네방네</h1><p>오늘의 기록이 내일의 성장이 되는 곳.<br>써즈의 콘텐츠 매니저에 입장하세요.</p><form id="login"><label for="password">관리자 비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required autofocus><button id="submit">입장하기 →</button><div id="error" class="error" role="alert"></div></form><div class="foot">개인 전용 공간 · 자료는 로그인 후에만 확인할 수 있어요.</div></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw new Error(data.error);location.href='/';}catch(e){error.textContent=e.message||'입장하지 못했어요.';}finally{button.disabled=false;}});</script></body></html>
