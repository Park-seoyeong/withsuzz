<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>써즈 동네방네로 보내기</title><style>
body{width:320px;margin:0;padding:14px;font:13px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#2e465d;background:#f7fafc}
h1{font-size:14px;margin:0 0 8px}p{margin:6px 0;color:#62788a}button{width:100%;margin-top:8px;padding:9px;border-radius:10px;border:1px solid #c9dbe8;background:#fff;font:inherit;cursor:pointer}button.primary{background:#70afd5;border-color:#70afd5;color:#fff;font-weight:600}
ul{list-style:none;margin:8px 0 0;padding:0;max-height:180px;overflow:auto}li{padding:6px 0;border-bottom:1px solid #e3edf4;font-size:12px}small{color:#8094a5}#status{min-height:18px;color:#3d7a52}
</style></head><body>
<h1>써즈 동네방네 수집기</h1>
<p>네이버 블로그 통계·쇼핑커넥트·마이리얼트립 등 <strong>보고 있는 화면</strong>을 읽어 사이트로 보내요. 로그인은 이 브라우저에 이미 된 상태를 그대로 써요.</p>
<button class="primary" id="grab">이 화면 보내기</button>
<button id="link">이 탭의 사이트와 연결 (자료가 안 넘어갈 때)</button>
<button id="copy">마지막 자료 복사 (사이트에 붙여넣기용)</button>
<h1 style="margin-top:14px">네이버 API</h1>
<p id="api-state"></p>
<button id="api-run">지금 API 불러오기</button>
<button id="api-options">API 설정</button>
<p id="status" role="status"></p>
<p><small>보낸 자료는 사이트를 열면 ‘확장에서 받은 자료’로 나타나요. 사이트에서 저장하기 전에는 아무것도 바뀌지 않아요.</small></p>
<ul id="queue"></ul>
<script src="popup.js"></script>
</body></html>
