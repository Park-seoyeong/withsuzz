# Cloudflare Workers 배포 설정 (써즈님 계정용)
# 데이터베이스(D1)와 파일 저장소(R2)는 첫 배포 때 Wrangler가 자동으로 만들어요.
name = "withsuzz-manager"
main = "dist/server/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[build]
command = "npm run build"

[vars]
# ChatGPT Sites 밖에서 돌릴 때 켜는 보호 모드: 외부 신원 헤더를 무시하고 관리자 비밀번호·자동화 토큰으로만 열어요.
STANDALONE = "1"

[[d1_databases]]
binding = "DB"
database_name = "withsuzz-manager"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "withsuzz-manager-files"

[observability]
enabled = true
